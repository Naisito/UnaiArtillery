<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080b" />
    <title>Unai Artillery — Estación de dirección de tiro</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Globo Cesium a pantalla completa; Three.js se superpone encima. -->
    <div id="cesiumContainer"></div>

    <!-- Estación de tiro (la rellenan los módulos de src/ui/). -->
    <header id="topbar" role="banner"></header>
    <aside id="leftDock" class="dock dock--left" aria-label="Misión de fuego"></aside>
    <aside id="rightDock" class="dock dock--right" aria-label="Datos: meteorología, tabla de tiro, análisis e instrucción"></aside>
    <div id="telemetry" hidden></div>
    <!-- HUD de artillero (solo en la cámara Artillero): compás, goniómetro, minimapa. -->
    <div id="gunnerHud"></div>
    <div id="toastStack" data-testid="toast-stack" role="status" aria-live="polite"></div>

    <!-- Pantalla de arranque: visible antes de cargar el JS. -->
    <div id="splash" role="progressbar" aria-label="Cargando la estación de tiro">
      <div class="splash__grid" aria-hidden="true"></div>
      <div class="splash__inner">
        <svg class="splash__logo" width="72" height="72" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 2.2l12 6.9v13.8l-12 6.9-12-6.9V9.1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
          <path d="M16 5.6l9 5.2v10.4l-9 5.2-9-5.2V10.8z" fill="currentColor" opacity=".08" />
          <path class="splash__arc" d="M8.6 21.4C10.4 11 18.4 9.4 22.6 19.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.1 2.6" />
          <circle cx="22.9" cy="20.4" r="2.4" stroke="currentColor" stroke-width="1.3" />
          <path d="M22.9 16.6v1.4M22.9 22.8v1.4M19.1 20.4h1.4M25.3 20.4h1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          <circle cx="8.6" cy="21.4" r="1.5" fill="currentColor" />
        </svg>
        <div class="splash__word"><b>UNAI</b> ARTILLERY</div>
        <div class="splash__tag">Estación de dirección de tiro · Tierra real</div>
        <div class="splash__bar"><span id="splashBar"></span></div>
        <ol class="splash__steps">
          <li data-boot="globe" data-state="active">Globo terrestre y relieve</li>
          <li data-boot="battery">Asentamiento de la batería</li>
          <li data-boot="core">Núcleo balístico</li>
          <li data-boot="scene">Escena 3D y pieza</li>
          <li data-boot="ui">Estación de tiro</li>
          <li data-boot="solution">Solución inicial</li>
        </ol>
        <p class="splash__error" hidden></p>
      </div>
      <div class="splash__foot">CesiumJS · Three.js · Núcleo balístico RK4 validado</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
